global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: trip-service
    metrics_path: /metrics
    static_configs:
      - targets: ["trip-service:8081"]

  - job_name: booking-service
    metrics_path: /metrics
    static_configs:
      - targets: ["booking-service:8082"]

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-service:8083"]
