name: transitflow-py

services:
  # ---- Infrastructure ----
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: transitflow-py-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: transitflow-py-cluster-01
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  trips-db:
    image: postgres:16-alpine
    container_name: transitflow-py-trips-db
    environment:
      POSTGRES_DB: trips
      POSTGRES_USER: transitflow
      POSTGRES_PASSWORD: transitflow
    ports:
      - "5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitflow -d trips"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16-alpine
    container_name: transitflow-py-bookings-db
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: transitflow
      POSTGRES_PASSWORD: transitflow
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitflow -d bookings"]
      interval: 5s
      timeout: 5s
      retries: 10

  payments-db:
    image: postgres:16-alpine
    container_name: transitflow-py-payments-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: transitflow
      POSTGRES_PASSWORD: transitflow
    ports:
      - "5445:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitflow -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Services ----
  trip-service:
    build: .
    image: transitflow-py:latest
    container_name: transitflow-py-trip-service
    command: ["uvicorn", "transitflow.trip.app:app", "--host", "0.0.0.0", "--port", "8081"]
    depends_on:
      trips-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://transitflow:transitflow@trips-db:5432/trips
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8081/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-service:
    build: .
    image: transitflow-py:latest
    container_name: transitflow-py-payment-service
    command: ["uvicorn", "transitflow.payment.app:app", "--host", "0.0.0.0", "--port", "8083"]
    depends_on:
      payments-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://transitflow:transitflow@payments-db:5432/payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRANSITFLOW_PAYMENT_DECLINE_ABOVE: "500.00"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8083/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  booking-service:
    build: .
    image: transitflow-py:latest
    container_name: transitflow-py-booking-service
    command: ["uvicorn", "transitflow.booking.app:app", "--host", "0.0.0.0", "--port", "8082"]
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      trip-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://transitflow:transitflow@bookings-db:5432/bookings
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRIP_SERVICE_URL: http://trip-service:8081
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8082/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
