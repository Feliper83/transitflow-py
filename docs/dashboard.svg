<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Illustrative mockup of the provisioned Grafana dashboard "TransitFlow — SAGA & Payments".
       Panel titles and PromQL-backed series mirror the real dashboard; sample data is representative. -->
  <defs>
    <linearGradient id="confFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#73bf69" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#73bf69" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="payFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5794f2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5794f2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="createdFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b877d9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b877d9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="httpFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffca3a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffca3a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- page background -->
  <rect width="1200" height="740" fill="#111217"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#181b1f"/>
  <rect x="0" y="55" width="1200" height="1" fill="#2c3235"/>
  <circle cx="28" cy="28" r="10" fill="#f05a28"/>
  <path d="M23 30 l5 -9 l5 9 z" fill="#fff" opacity="0.9"/>
  <text x="50" y="33" fill="#d8d9da" font-size="16" font-weight="600">TransitFlow — SAGA &amp; Payments</text>
  <rect x="980" y="16" width="120" height="24" rx="4" fill="#22252b" stroke="#2c3235"/>
  <text x="1040" y="32" fill="#9aa0a6" font-size="12" text-anchor="middle">Last 15 minutes</text>
  <rect x="908" y="16" width="60" height="24" rx="4" fill="#22252b" stroke="#2c3235"/>
  <text x="938" y="32" fill="#9aa0a6" font-size="12" text-anchor="middle">5s</text>

  <!-- ============ ROW 1 ============ -->

  <!-- Panel A: Bookings by status -->
  <g transform="translate(20,74)">
    <rect width="376" height="300" rx="3" fill="#181b1f" stroke="#2c3235"/>
    <text x="14" y="26" fill="#d8d9da" font-size="13" font-weight="600">Bookings by status</text>
    <text x="362" y="26" fill="#9aa0a6" font-size="11" text-anchor="end">rate 5m</text>
    <!-- gridlines -->
    <line x1="14" y1="100" x2="362" y2="100" stroke="#20232a"/>
    <line x1="14" y1="160" x2="362" y2="160" stroke="#20232a"/>
    <line x1="14" y1="220" x2="362" y2="220" stroke="#20232a"/>
    <line x1="14" y1="276" x2="362" y2="276" stroke="#2c3235"/>
    <!-- CONFIRMED -->
    <polygon points="14,240 64,210 114,200 164,170 214,150 264,120 314,100 362,80 362,276 14,276" fill="url(#confFill)"/>
    <polyline points="14,240 64,210 114,200 164,170 214,150 264,120 314,100 362,80" fill="none" stroke="#73bf69" stroke-width="2"/>
    <!-- CANCELLED -->
    <polyline points="14,270 64,265 114,260 164,268 214,255 264,258 314,250 362,252" fill="none" stroke="#f2495c" stroke-width="2"/>
    <!-- legend -->
    <rect x="14" y="286" width="10" height="4" fill="#73bf69"/>
    <text x="30" y="291" fill="#9aa0a6" font-size="11">CONFIRMED</text>
    <rect x="112" y="286" width="10" height="4" fill="#f2495c"/>
    <text x="128" y="291" fill="#9aa0a6" font-size="11">CANCELLED</text>
  </g>

  <!-- Panel B: Payments by result -->
  <g transform="translate(412,74)">
    <rect width="376" height="300" rx="3" fill="#181b1f" stroke="#2c3235"/>
    <text x="14" y="26" fill="#d8d9da" font-size="13" font-weight="600">Payments by result</text>
    <text x="362" y="26" fill="#9aa0a6" font-size="11" text-anchor="end">rate 5m</text>
    <line x1="14" y1="100" x2="362" y2="100" stroke="#20232a"/>
    <line x1="14" y1="160" x2="362" y2="160" stroke="#20232a"/>
    <line x1="14" y1="220" x2="362" y2="220" stroke="#20232a"/>
    <line x1="14" y1="276" x2="362" y2="276" stroke="#2c3235"/>
    <!-- COMPLETED -->
    <polygon points="14,230 64,200 114,205 164,175 214,160 264,140 314,130 362,110 362,276 14,276" fill="url(#payFill)"/>
    <polyline points="14,230 64,200 114,205 164,175 214,160 264,140 314,130 362,110" fill="none" stroke="#5794f2" stroke-width="2"/>
    <!-- FAILED -->
    <polyline points="14,272 64,268 114,255 164,265 214,258 264,260 314,250 362,255" fill="none" stroke="#ff9830" stroke-width="2"/>
    <rect x="14" y="286" width="10" height="4" fill="#5794f2"/>
    <text x="30" y="291" fill="#9aa0a6" font-size="11">COMPLETED</text>
    <rect x="118" y="286" width="10" height="4" fill="#ff9830"/>
    <text x="134" y="291" fill="#9aa0a6" font-size="11">FAILED</text>
  </g>

  <!-- Panel C: Outbox pending (stat) -->
  <g transform="translate(804,74)">
    <rect width="376" height="300" rx="3" fill="#181b1f" stroke="#2c3235"/>
    <text x="14" y="26" fill="#d8d9da" font-size="13" font-weight="600">Outbox pending</text>
    <text x="188" y="150" fill="#73bf69" font-size="90" font-weight="700" text-anchor="middle">0</text>
    <text x="188" y="190" fill="#9aa0a6" font-size="13" text-anchor="middle">unsent events</text>
    <text x="188" y="250" fill="#5a5f66" font-size="11" text-anchor="middle">transitflow_outbox_pending</text>
    <!-- tiny flat sparkline -->
    <polyline points="40,220 100,218 160,222 220,219 280,221 336,220" fill="none" stroke="#73bf69" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- ============ ROW 2 ============ -->

  <!-- Panel D: SAGA p95 duration (stat) -->
  <g transform="translate(20,390)">
    <rect width="376" height="300" rx="3" fill="#181b1f" stroke="#2c3235"/>
    <text x="14" y="26" fill="#d8d9da" font-size="13" font-weight="600">SAGA duration (p95)</text>
    <text x="188" y="150" fill="#ffca3a" font-size="80" font-weight="700" text-anchor="middle">0.42<tspan font-size="34"> s</tspan></text>
    <text x="188" y="192" fill="#9aa0a6" font-size="13" text-anchor="middle">booking → terminal state</text>
    <text x="188" y="250" fill="#5a5f66" font-size="11" text-anchor="middle">histogram_quantile(0.95, …saga_duration_seconds)</text>
  </g>

  <!-- Panel E: Bookings created / s -->
  <g transform="translate(412,390)">
    <rect width="376" height="300" rx="3" fill="#181b1f" stroke="#2c3235"/>
    <text x="14" y="26" fill="#d8d9da" font-size="13" font-weight="600">Bookings created / s</text>
    <text x="362" y="26" fill="#9aa0a6" font-size="11" text-anchor="end">rate 5m</text>
    <line x1="14" y1="100" x2="362" y2="100" stroke="#20232a"/>
    <line x1="14" y1="160" x2="362" y2="160" stroke="#20232a"/>
    <line x1="14" y1="220" x2="362" y2="220" stroke="#20232a"/>
    <line x1="14" y1="276" x2="362" y2="276" stroke="#2c3235"/>
    <polygon points="14,200 64,180 114,210 164,170 214,190 264,160 314,175 362,150 362,276 14,276" fill="url(#createdFill)"/>
    <polyline points="14,200 64,180 114,210 164,170 214,190 264,160 314,175 362,150" fill="none" stroke="#b877d9" stroke-width="2"/>
    <rect x="14" y="286" width="10" height="4" fill="#b877d9"/>
    <text x="30" y="291" fill="#9aa0a6" font-size="11">transitflow_bookings_created_total</text>
  </g>

  <!-- Panel F: HTTP p95 latency -->
  <g transform="translate(804,390)">
    <rect width="376" height="300" rx="3" fill="#181b1f" stroke="#2c3235"/>
    <text x="14" y="26" fill="#d8d9da" font-size="13" font-weight="600">HTTP latency (p95)</text>
    <text x="362" y="26" fill="#9aa0a6" font-size="11" text-anchor="end">by route</text>
    <line x1="14" y1="100" x2="362" y2="100" stroke="#20232a"/>
    <line x1="14" y1="160" x2="362" y2="160" stroke="#20232a"/>
    <line x1="14" y1="220" x2="362" y2="220" stroke="#20232a"/>
    <line x1="14" y1="276" x2="362" y2="276" stroke="#2c3235"/>
    <polygon points="14,210 64,205 114,215 164,200 214,208 264,195 314,205 362,190 362,276 14,276" fill="url(#httpFill)"/>
    <polyline points="14,210 64,205 114,215 164,200 214,208 264,195 314,205 362,190" fill="none" stroke="#ffca3a" stroke-width="2"/>
    <rect x="14" y="286" width="10" height="4" fill="#ffca3a"/>
    <text x="30" y="291" fill="#9aa0a6" font-size="11">http_request_duration_seconds (p95)</text>
  </g>

  <!-- footer note -->
  <text x="20" y="726" fill="#5a5f66" font-size="11">Illustrative layout preview — mirrors the provisioned Grafana dashboard and its PromQL queries; sample data shown.</text>
</svg>
